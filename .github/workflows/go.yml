name: go
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      - run: go build ./...
  go-lint:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      - uses: golangci/golangci-lint-action@v8
  go-test:
    runs-on: ubuntu-24.04-16c-64gb
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      # -p bounds how many packages run at once. ~20 packages start their own
      # database container, so the GOMAXPROCS default (16 on this runner) had 16
      # ClickHouse/Postgres/Neo4j servers each sizing thread pools and caches for
      # the whole machine, which is what pushed container-backed tests toward
      # their handler deadlines. Fewer packages at once means more CPU per
      # container; watch total step time here against the pre-change baseline.
      - run: go test -race -v -p 6 ./...
  evals-short:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -short -tags evals -v ./agent/evals/...
