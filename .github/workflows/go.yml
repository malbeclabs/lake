name: go
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      - run: go build ./...
  go-lint:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      - uses: golangci/golangci-lint-action@v8
  go-test:
    runs-on: ubuntu-24.04-16c-64gb
    needs: go-build
    # Raising the per-binary -timeout below removes the runner-speed false
    # alarm, but it also removes what was accidentally capping a genuine hang.
    # GitHub's default job timeout is 6 hours; a healthy run is ~8 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: dev/controlcenter/ui
      - run: bun run build
        working-directory: dev/controlcenter/ui
      # -p bounds how many packages run at once. ~20 packages start their own
      # database container, so the GOMAXPROCS default (16 on this runner) had 16
      # ClickHouse/Postgres/Neo4j servers each sizing thread pools and caches for
      # the whole machine, which is what pushed container-backed tests toward
      # their handler deadlines. Fewer packages at once means more CPU per
      # container, and costs nothing in wall time: one package's critical path
      # bounds the suite (390s at -p 6 vs 402s at the default).
      #
      # -timeout is set explicitly because Go's default is 10m per test binary,
      # and the two longest packages sit near it on a healthy run — api/handlers
      # at 342s and indexer/pkg/dz/graph at 311s, 57% and 52% of the budget. A
      # runner that is merely slow, not broken, then reads as a test failure: on
      # 16dba8e6 every package took about twice as long (geoip 41s→91s, sol
      # 48s→98s, mroute 164s→442s) with no assertion failure anywhere, and those
      # two binaries panicked on the deadline while the tests they were running
      # had been going 8 seconds. 30m keeps a real hang bounded well inside the
      # job's own timeout while leaving room for a bad runner.
      - run: go test -race -v -p 6 -timeout 30m ./...
  evals-short:
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -short -tags evals -v ./agent/evals/...
